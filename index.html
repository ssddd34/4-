<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我是你爸爸真伟大</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#0b0b12;}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
    gap:8vh;
    -webkit-tap-highlight-color:transparent;
  }
  .txt{
    font-size:11.5vw;
    font-weight:900;
    line-height:1.14;
    text-align:center;
    user-select:none;
    letter-spacing:-0.02em;
    background:linear-gradient(100deg,#ff2d55,#ff9500,#ffd60a,#34c759,#0a84ff,#bf5af2);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,80,140,.35));
    animation:pop .7s cubic-bezier(.2,1.6,.4,1) both, flow 4s linear infinite;
  }
  .txt span{display:block;}
  @keyframes pop{
    from{transform:scale(.35);opacity:0}
    to  {transform:scale(1);opacity:1}
  }
  @keyframes flow{
    0%  {background-position:0% 50%}
    100%{background-position:300% 50%}
  }
  #btn{
    font-size:5.2vw;
    padding:.75em 1.6em;
    border:none;
    border-radius:999px;
    color:#fff;
    font-weight:700;
    background:linear-gradient(135deg,#ff2d55,#bf5af2);
    box-shadow:0 8px 26px rgba(191,90,242,.45);
    transition:transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #btn:active{transform:scale(.94);}
</style>
</head>
<body>

  <div class="txt">
    <span>我是你爸爸真伟大</span>
    <span>养你这么大</span>
  </div>

  <button id="btn">🔊 播放音乐</button>

  <!-- 把 music.mp3 换成你自己的音乐文件名 -->
  <audio id="bgm" src="music.mp3" loop preload="auto" playsinline></audio>

<script>
(function(){
  var btn  = document.getElementById('btn');
  var bgm  = document.getElementById('bgm');
  var fileOk = true;
  var playing = false;

  bgm.addEventListener('error', function(){ fileOk = false; });

  // 备用：自带《小星星》合成音
  var audioCtx=null, master=null, loopTimer=null;
  var B = 0.42;
  var notes = [
    [523.25,B],[523.25,B],[784.00,B],[784.00,B],[880.00,B],[880.00,B],[784.00,B*2],
    [698.46,B],[698.46,B],[659.25,B],[659.25,B],[587.33,B],[587.33,B],[523.25,B*2],
    [784.00,B],[784.00,B],[698.46,B],[698.46,B],[659.25,B],[659.25,B],[587.33,B*2],
    [784.00,B],[784.00,B],[698.46,B],[698.46,B],[659.25,B],[659.25,B],[587.33,B*2],
    [523.25,B],[523.25,B],[784.00,B],[784.00,B],[880.00,B],[880.00,B],[784.00,B*2],
    [698.46,B],[698.46,B],[659.25,B],[659.25,B],[587.33,B],[587.33,B],[523.25,B*2]
  ];
  function playNote(freq,start,dur){
    var osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type='triangle'; osc.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,start);
    g.gain.exponentialRampToValueAtTime(0.28,start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    osc.connect(g); g.connect(master);
    osc.start(start); osc.stop(start+dur+0.05);
  }
  function scheduleLoop(){
    if(!playing) return;
    var t=audioCtx.currentTime+0.08;
    for(var i=0;i<notes.length;i++){
      playNote(notes[i][0],t,notes[i][1]*0.92);
      t+=notes[i][1];
    }
    loopTimer=setTimeout(scheduleLoop,(t-audioCtx.currentTime)*1000);
  }
  function stopFallback(){
    clearTimeout(loopTimer);
    if(audioCtx){ audioCtx.close(); audioCtx=null; master=null; }
  }

  btn.addEventListener('click', function(){
    if(playing){
      playing=false;
      bgm.pause();
      stopFallback();
      btn.textContent='🔊 播放音乐';
      return;
    }
    playing=true;
    btn.textContent='🔇 停止音乐';

    if(fileOk){
      bgm.play().catch(function(){
        fileOk=false;
        startFallback();
      });
    }else{
      startFallback();
    }
  });

  function startFallback(){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){ btn.textContent='音乐加载失败'; playing=false; return; }
    audioCtx=new AC();
    master=audioCtx.createGain();
    master.gain.value=0.85;
    master.connect(audioCtx.destination);
    if(audioCtx.state==='suspended') audioCtx.resume();
    scheduleLoop();
  }
})();
</script>
</body>
</html>
